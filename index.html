<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css" type="text/css"/>
  <title>Frontend Mentor | QR code component</title>
</head>
<body>
  <main class="page-container">
    <div class="qr-card" aria-labelledby="main-heading" aria-describedby="qr-description">
      <img class="qr-card__img" src="images/image-qr-code.png" alt="qr code link to Frontend Mentor"/>
      <h1 id="main-heading" class="qr-card__heading">Improve your front-end skills by building projects</h1>
      <p id="qr-description" class="qr-card__description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </main>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/ronrljr/">Ron L</a>.
  </div>
</body>
</html>
